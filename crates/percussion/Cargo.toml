[package]
name = "percussion"
description = "Percussion — a Bevy game."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

# Expose the game as both a library (for tests / alt front-ends) and a binary.
[lib]
name = "percussion"
path = "src/lib.rs"

[[bin]]
name = "percussion"
path = "src/main.rs"

[dependencies]
bevy = { workspace = true }
avian3d = { workspace = true }
bevy_sprite3d = { workspace = true }
bevy_asset_loader = { workspace = true }
bevy_panorbit_camera = { workspace = true }
bevy-inspector-egui = { workspace = true }
# 单函数 RNG（`fastrand::f32()` 返回 0..1）。暴击 / 掉率类一次性概率
# 检查用，避免拉进整个 `rand` 生态。无 sub-deps，无 std-feature 取舍。
fastrand = "2"

[features]
default = []

# Enable with `cargo run --features dev`.
# Uses Bevy's dynamic linking for much faster iterative compile times during
# development, and pulls in `bevy_dev_tools` (FPS overlay, etc.).
# Do NOT enable this for release builds.
dev = ["bevy/dynamic_linking", "bevy/bevy_dev_tools"]
