<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skill Power Curve</title>
  <style>
    :root {
      --bg: #f6f3ea;
      --panel: #fffaf0;
      --ink: #1d2430;
      --muted: #6b7280;
      --line: #d8d0bd;
      --accent: #b0472e;
      --blue: #2563eb;
      --green: #15803d;
      --purple: #7c3aed;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, "Noto Serif SC", "Microsoft YaHei", serif;
      line-height: 1.5;
    }

    main {
      max-width: 1160px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .lead {
      max-width: 860px;
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 15px;
    }

    .controls,
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 1px 0 rgba(29, 36, 48, 0.04);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px 20px;
      align-items: center;
      padding: 16px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .value {
      min-width: 132px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      text-align: center;
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 16px;
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .panel {
      padding: 14px;
    }

    .panel h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 360px;
      background: #fffef9;
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .swatch {
      display: inline-block;
      width: 20px;
      height: 3px;
      margin-right: 6px;
      vertical-align: middle;
      border-radius: 99px;
      background: currentColor;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      font-size: 14px;
    }

    th,
    td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
      text-align: right;
    }

    th:first-child,
    td:first-child {
      text-align: left;
    }

    th {
      background: #efe7d4;
      font-weight: 700;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .note {
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 860px) {
      .grid,
      .controls {
        grid-template-columns: 1fr;
      }

      .value {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>技能强度曲线</h1>
    <p class="lead">
      公式：power(level) = (level / 99)<sup>r</sup>。当 r &gt; 1 时，前期每级加得少，后期每级加得多；右图直接画“每升 1 级增加多少强度”。
    </p>

    <section class="controls" aria-label="curve controls">
      <div>
        <label for="power">调整 r（后段加速程度）</label>
        <input id="power" type="range" min="1" max="3" value="1.5" step="0.05" />
      </div>
      <div class="value">r = <span id="powerValue">1.50</span></div>
    </section>

    <section class="grid">
      <div class="panel">
        <h2>强度占满级比例</h2>
        <canvas id="powerChart" width="720" height="440"></canvas>
        <div class="legend">
          <span style="color: var(--blue)"><span class="swatch"></span>r=1 线性</span>
          <span style="color: var(--green)"><span class="swatch"></span>r=1.5</span>
          <span style="color: var(--purple)"><span class="swatch"></span>r=2</span>
          <span style="color: var(--accent)"><span class="swatch"></span>当前 r</span>
        </div>
      </div>

      <div class="panel">
        <h2>每级增加多少强度</h2>
        <canvas id="gainChart" width="720" height="440"></canvas>
        <div class="note">
          这张图越往右越高，就表示“后期升级更值钱”。线性 r=1 的每级增量几乎是一条平线。
        </div>
      </div>
    </section>

    <table>
      <thead>
        <tr>
          <th>等级</th>
          <th>r=1</th>
          <th>r=1.5</th>
          <th>r=2</th>
          <th>当前 r</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>

  <script>
    const maxLevel = 99;
    const sampleLevels = [1, 10, 20, 40, 60, 70, 80, 90, 95, 99];
    const colors = {
      linear: '#2563eb',
      mild: '#15803d',
      steep: '#7c3aed',
      current: '#b0472e',
      grid: '#e7dfce',
      text: '#596273'
    };

    const powerInput = document.getElementById('power');
    const powerValue = document.getElementById('powerValue');
    const rows = document.getElementById('rows');

    function power(level, exponent) {
      return Math.pow(level / maxLevel, exponent);
    }

    function pct(value) {
      return `${Math.round(value * 1000) / 10}%`;
    }

    function setupCanvas(canvas) {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      const context = canvas.getContext('2d');
      context.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { context, width: rect.width, height: rect.height };
    }

    function drawAxes(context, width, height, yLabel) {
      const pad = { left: 52, right: 18, top: 18, bottom: 38 };
      const chartWidth = width - pad.left - pad.right;
      const chartHeight = height - pad.top - pad.bottom;

      context.clearRect(0, 0, width, height);
      context.font = '12px Consolas, monospace';
      context.lineWidth = 1;

      context.strokeStyle = colors.grid;
      context.fillStyle = colors.text;

      for (let i = 0; i <= 5; i += 1) {
        const y = pad.top + chartHeight * (i / 5);
        context.beginPath();
        context.moveTo(pad.left, y);
        context.lineTo(width - pad.right, y);
        context.stroke();
        const label = `${100 - i * 20}%`;
        context.fillText(label, 10, y + 4);
      }

      [1, 20, 40, 60, 80, 99].forEach((level) => {
        const x = pad.left + chartWidth * ((level - 1) / (maxLevel - 1));
        context.beginPath();
        context.moveTo(x, pad.top);
        context.lineTo(x, height - pad.bottom);
        context.stroke();
        context.fillText(String(level), x - 8, height - 14);
      });

      context.strokeStyle = '#7b7160';
      context.beginPath();
      context.moveTo(pad.left, pad.top);
      context.lineTo(pad.left, height - pad.bottom);
      context.lineTo(width - pad.right, height - pad.bottom);
      context.stroke();

      context.save();
      context.translate(14, pad.top + chartHeight / 2);
      context.rotate(-Math.PI / 2);
      context.fillText(yLabel, 0, 0);
      context.restore();

      return { pad, chartWidth, chartHeight };
    }

    function drawPowerChart(exponent) {
      const canvas = document.getElementById('powerChart');
      const { context, width, height } = setupCanvas(canvas);
      const { pad, chartWidth, chartHeight } = drawAxes(context, width, height, '强度');

      drawCurve(context, pad, chartWidth, chartHeight, (level) => power(level, 1), colors.linear, 2, [8, 5]);
      drawCurve(context, pad, chartWidth, chartHeight, (level) => power(level, 1.5), colors.mild, 2, [4, 4]);
      drawCurve(context, pad, chartWidth, chartHeight, (level) => power(level, 2), colors.steep, 2, [2, 3]);
      drawCurve(context, pad, chartWidth, chartHeight, (level) => power(level, exponent), colors.current, 4, []);
    }

    function drawGainChart(exponent) {
      const canvas = document.getElementById('gainChart');
      const { context, width, height } = setupCanvas(canvas);
      const { pad, chartWidth, chartHeight } = drawAxes(context, width, height, '相对每级增量');

      const maxGain = power(maxLevel, exponent) - power(maxLevel - 1, exponent);
      drawCurve(context, pad, chartWidth, chartHeight, (level) => {
        if (level <= 1) return 0;
        return (power(level, exponent) - power(level - 1, exponent)) / maxGain;
      }, colors.current, 4, []);

      drawCurve(context, pad, chartWidth, chartHeight, (level) => {
        if (level <= 1) return 0;
        const linearGain = power(level, 1) - power(level - 1, 1);
        const linearMaxGain = power(maxLevel, 1) - power(maxLevel - 1, 1);
        return linearGain / linearMaxGain;
      }, colors.linear, 2, [8, 5]);
    }

    function drawCurve(context, pad, chartWidth, chartHeight, fn, color, width, dash) {
      context.save();
      context.strokeStyle = color;
      context.lineWidth = width;
      context.setLineDash(dash);
      context.beginPath();
      for (let level = 1; level <= maxLevel; level += 1) {
        const x = pad.left + chartWidth * ((level - 1) / (maxLevel - 1));
        const y = pad.top + chartHeight * (1 - fn(level));
        if (level === 1) context.moveTo(x, y);
        else context.lineTo(x, y);
      }
      context.stroke();
      context.restore();
    }

    function updateTable(exponent) {
      rows.innerHTML = sampleLevels.map((level) => `
        <tr>
          <td>${level}</td>
          <td>${pct(power(level, 1))}</td>
          <td>${pct(power(level, 1.5))}</td>
          <td>${pct(power(level, 2))}</td>
          <td>${pct(power(level, exponent))}</td>
        </tr>
      `).join('');
    }

    function render() {
      const exponent = Number(powerInput.value);
      powerValue.textContent = exponent.toFixed(2);
      drawPowerChart(exponent);
      drawGainChart(exponent);
      updateTable(exponent);
    }

    powerInput.addEventListener('input', render);
    window.addEventListener('resize', render);
    render();
  </script>
</body>
</html>
