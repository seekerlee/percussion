[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = ""
authors = []

[workspace.dependencies]
bevy = "0.18.1"
avian3d = "0.6.1"
# 2D sprite → 3D quad 适配层：把 `Sprite` / `TextureAtlas` 烤成共享
# 的 3D mesh + `StandardMaterial`，自动按贴图尺寸 / pixels_per_metre
# 算物理尺寸；内部 cache 让同一张图 / atlas 帧只生成一次 mesh / material。
# billboard 行为仍由本仓自家的 `sprite_billboard` 模块负责（仅 Y 轴 yaw）。
bevy_sprite3d = "8.0"
# 资产预加载框架：配合 `States` 做 Loading 阶段，领域 plugin 用
# `#[derive(AssetCollection)]` 声明自家资产，加载完成后自动插
# 成 Resource、并切到下一个 state。避免手写轮询 + 手存 `Handle<T>`。
#
# 启 `3d` feature：让 `#[asset(image(sampler(...)))]` 属性可用
# （image 采样器配置依赖 bevy_render 类型，要么开 `2d` 要么开 `3d`，
#  开哪个都行；本项目走 3D，顺手开 `3d`，附带也支持直接加载
#  `Handle<StandardMaterial>`，未来可能用得上）。
bevy_asset_loader = { version = "0.26", features = ["3d"] }
# Pan/orbit camera controller — used only by the dev-build camera helper
# (see crates/percussion/src/dev_camera.rs). Release builds gate the module
# behind `cfg(debug_assertions)` so this dep does not enter the shipped binary.
#
# `bevy_egui` feature: panorbit 在该 feature 下自动消费 `EguiWantsFocus`，
# 当鼠标位于 / 正在拖动 egui 面板（见 `dev/inspector.rs`）时不抢输入。
# 两个 crate 都共用 `bevy_egui 0.39.x`，开这个 feature 不会拉重复版本。
bevy_panorbit_camera = { version = "0.34", features = ["bevy_egui"] }
# egui-based inspector for live editing of any `Reflect` component / resource.
# Used only by `crates/percussion/src/dev/inspector.rs`. Same `cfg(debug_assertions)`
# gating as `bevy_panorbit_camera` so the panel never enters release builds.
# 0.36 matches Bevy 0.18 (see crate's support table). Pulls `bevy_egui` itself,
# so we don't list it here separately.
bevy-inspector-egui = "0.36"

# ---------------------------------------------------------------------------
# Profile tuning
#
# Bevy's debug builds are very slow with default settings. We turn on a tiny
# amount of optimization in `dev` for our own code, and full optimization for
# every dependency. Dependencies are only built once (and cached), so this
# does not noticeably hurt iteration time.
#
# The biggest dev-loop killer is *linking*, not compiling. We reduce its cost
# by emitting only the debug info we actually use and putting it next to the
# binary instead of inside it.
# ---------------------------------------------------------------------------

[profile.dev]
opt-level = 1
# Keep enough debug info for useful stack traces and line numbers, but skip
# full variable-level info — saves a lot of linker time on Bevy-sized graphs.
debug = "line-tables-only"
# Emit debug info as a separate side file (.pdb on Windows) instead of baking
# it into the binary. Much faster incremental linking.
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3
# Dependencies' debug info is rarely useful to us. Dropping it shaves seconds
# off every link and reduces target/ size by a lot.
debug = false

# Release profile: optimize for runtime performance and small binary size.
[profile.release]
codegen-units = 1
lto = "thin"

# `cargo build --profile dist` produces a binary suitable for shipping.
[profile.dist]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
